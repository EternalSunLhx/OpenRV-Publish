name: 构建错误日志摘要 (Manual)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: '本仓库需要诊断的 GitHub Actions job 数字 ID'
        required: false
        type: string
      artifact_id:
        description: '本仓库 mixed Qt 小型 proof artifact 数字 ID；与 job_id 二选一'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    name: Read one job log and summarize errors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exactly one repository diagnostic target
        env:
          DIAGNOSTIC_JOB_ID: ${{ inputs.job_id }}
          DIAGNOSTIC_ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DIAGNOSTIC_JOB_ID" && -n "$DIAGNOSTIC_ARTIFACT_ID" ]] || [[ -z "$DIAGNOSTIC_JOB_ID" && -z "$DIAGNOSTIC_ARTIFACT_ID" ]]; then
            echo 'Provide exactly one of job_id or artifact_id.' >&2
            exit 1
          fi
          target="${DIAGNOSTIC_JOB_ID:-$DIAGNOSTIC_ARTIFACT_ID}"
          if [[ ! "$target" =~ ^[1-9][0-9]{0,19}$ ]] || [[ "$GITHUB_REPOSITORY" != 'EternalSunLhx/OpenRV-Publish' ]]; then
            echo 'A positive numeric ID and the authorized repository are required.' >&2
            exit 1
          fi
      - name: Check out the immutable artifact-reader source
        if: inputs.artifact_id != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read bounded captured native stderr from a verified small proof artifact
        if: inputs.artifact_id != ''
        env:
          DIAGNOSTIC_ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        shell: bash
        run: |
          set -euo pipefail
          unset GH_DEBUG
          python3 -B ci/localized-release/inspect_mixed_qt_artifact.py "$DIAGNOSTIC_ARTIFACT_ID"
      - name: Download and summarize this repository's job log
        if: inputs.job_id != ''
        env:
          DIAGNOSTIC_JOB_ID: ${{ inputs.job_id }}
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DIAGNOSTIC_JOB_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo 'job_id must contain only a positive numeric job ID (at most 20 digits).' >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != 'EternalSunLhx/OpenRV-Publish' ]]; then
            echo 'This diagnostic is restricted to EternalSunLhx/OpenRV-Publish.' >&2
            exit 1
          fi
          unset GH_DEBUG
          log_file="$RUNNER_TEMP/openrv-diagnostic-job.log"
          # Preserve the real status; only a redacted, bounded stderr excerpt may be printed.
          download_status=0
          # Raw terminal sequences go only to the private file and are stripped by Python.
          timeout --kill-after=5s 45s gh api --hostname github.com --allow-escape-sequences \
            "repos/$GITHUB_REPOSITORY/actions/jobs/$DIAGNOSTIC_JOB_ID/logs" \
            > "$log_file" 2> "$RUNNER_TEMP/openrv-diagnostic-download.err" || download_status=$?
          if (( download_status != 0 )); then
            python3 - "$RUNNER_TEMP/openrv-diagnostic-download.err" "$download_status" <<'PYERR'
          from pathlib import Path
          import os
          import re
          import secrets
          import sys

          status = int(sys.argv[2])
          message = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          terminal_sequences = re.compile(
              r'(?:\x1b\]|\x9d)[\s\S]*?(?:\x07|\x1b\\|\x9c|\Z)'
              r'|(?:\x1b[PX^_]|[\x90\x98\x9e\x9f])[\s\S]*?(?:\x1b\\|\x9c|\Z)'
              r'|(?:\x1b\[|\x9b)[0-?]*[ -/]*[@-~]'
              r'|\x1b[ -/]*[0-~]|[\x00-\x08\x0b-\x1f\x7f-\x9f]'
          )
          message = terminal_sequences.sub('', message)
          for name in ('GH_TOKEN', 'GITHUB_TOKEN'):
              value = os.environ.get(name, '')
              if value:
                  message = message.replace(value, '<redacted-token>')
          message = re.sub(r'https?://[^\s<>\"\']+', '<url>', message, flags=re.IGNORECASE)
          message = re.sub(
              r'(?im)\b(?:proxy-authorization|authorization|cookie|set-cookie)\s*[:=][^\r\n]*',
              '<redacted-header>', message,
          )
          message = re.sub(r'(?i)\b(?:bearer|basic|token)\s+[^\s,;]+', '<redacted-authorization>', message)
          message = re.sub(r'(?i)\b(?:GH_TOKEN|GITHUB_TOKEN)\s*[:=]\s*\S+', '<redacted-token>', message)
          message = re.sub(r'\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b', '<redacted-token>', message)
          message = message.encode('utf-8')[:1023].decode('utf-8', errors='ignore') or '(stderr was empty)'
          if status in (124, 137):
              print(f'Download command timed out or was terminated (gh/timeout exit code {status}).')
          else:
              print(f'Download failed (gh/timeout exit code {status}).')
          token = secrets.token_hex(32)
          while token in message:
              token = secrets.token_hex(32)
          print(f'::stop-commands::{token}', flush=True)
          try:
              print('Redacted download stderr (at most 1 KiB):')
              print(message)
          finally:
              print(f'::{token}::', flush=True)
          PYERR
            exit "$download_status"
          fi
          python3 - "$log_file" <<'PY'
          from pathlib import Path
          import re
          import secrets
          import sys

          data = Path(sys.argv[1]).read_bytes()
          text = data.decode('utf-8-sig', errors='replace').replace('\r\n', '\n').replace('\r', '\n')
          terminal_sequences = re.compile(
              r'(?:\x1b\]|\x9d)[\s\S]*?(?:\x07|\x1b\\|\x9c|\Z)'
              r'|(?:\x1b[PX^_]|[\x90\x98\x9e\x9f])[\s\S]*?(?:\x1b\\|\x9c|\Z)'
              r'|(?:\x1b\[|\x9b)[0-?]*[ -/]*[@-~]'
              r'|\x1b[ -/]*[0-~]|[\x00-\x08\x0b-\x1f\x7f-\x9f]'
          )
          text = terminal_sequences.sub('', text)
          if not re.match(r'\d{4}-\d{2}-\d{2}T', text):
              raise SystemExit('The downloaded response is not a timestamped plain-text job log.')
          lines = text.splitlines()
          error_pattern = re.compile(
              r'(?:^|\s)(?:fatal\s+)?error(?:\s+[A-Z]+\d+)?:'
              r'|CMake Error(?:\s|:)|^FAILED:|##\[error\]'
              r'|ninja: build stopped|make(?:\[\d+\])?: \*\*\*'
              r'|Traceback \(most recent call last\):'
              r'|No space left on device|Segmentation fault',
              re.IGNORECASE,
          )
          errors = [
              index for index, line in enumerate(lines)
              if error_pattern.search(re.sub(r'^\d{4}-\d{2}-\d{2}T\S+\s+', '', line))
          ]
          # Keep both the first cause and the final failure when many errors follow.
          selected_errors = sorted(set(errors[:6] + errors[-6:]))
          selected_lines = sorted({
              line_index
              for index in selected_errors
              for line_index in range(max(0, index - 3), min(len(lines), index + 7))
          })
          fragments = []
          previous = None
          for index in selected_lines:
              if previous is not None and index != previous + 1:
                  fragments.append('... omitted intervening lines ...')
              fragments.append(f'{index + 1}: {lines[index]}')
              previous = index

          limit = 24 * 1024 - 1  # Reserve the newline added by print().

          def bounded(value, *, tail_only=False):
              encoded = value.encode('utf-8')
              if len(encoded) <= limit:
                  return value
              if tail_only:
                  return encoded[-limit:].decode('utf-8', errors='ignore')
              marker = b'\n... excerpt truncated to 24 KiB ...\n'
              half = (limit - len(marker)) // 2
              return (encoded[:half].decode('utf-8', errors='ignore')
                      + marker.decode('ascii')
                      + encoded[-half:].decode('utf-8', errors='ignore'))

          error_excerpt = bounded('\n'.join(fragments) or '(No matching error lines found.)')
          tail_excerpt = bounded('\n'.join(lines[-100:]), tail_only=True)
          token = secrets.token_hex(32)
          while token in text:
              token = secrets.token_hex(32)
          print(f'Job log: {len(data)} bytes, {len(lines)} lines; {len(errors)} matching error lines.')
          # The remote log is untrusted. Disable workflow commands before any of it is emitted.
          print(f'::stop-commands::{token}', flush=True)
          try:
              print('ERROR CONTEXT (at most 24 KiB):')
              print(error_excerpt)
              print('FINAL 100 LINES (at most 24 KiB):')
              print(tail_excerpt)
          finally:
              print(f'::{token}::', flush=True)
          PY
