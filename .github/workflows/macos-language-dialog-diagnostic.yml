name: macOS 原生语言提示框诊断 (Manual)
run-name: macOS 原生语言提示框诊断 ${{ github.run_number }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dialog:
    name: Native language dialog ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install only isolated official Qt widget bindings
        env:
          DIALOG_ARCH: ${{ matrix.arch }}
          DIALOG_BINDINGS: ${{ runner.temp }}/openrv-language-dialog-bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$DIALOG_ARCH"
          python3 -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-compile \
            --target "$DIALOG_BINDINGS" 'PySide6_Essentials==6.5.3' 'shiboken6==6.5.3'
      - name: Exercise actual old and fixed native message-box helpers
        env:
          DIALOG_ARCH: ${{ matrix.arch }}
          DIALOG_BINDINGS: ${{ runner.temp }}/openrv-language-dialog-bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 -B ci/localized-release/macos_language_dialog_fixture.py \
            --repo "$GITHUB_WORKSPACE" --bindings "$DIALOG_BINDINGS" --arch "$DIALOG_ARCH" \
            --work "$RUNNER_TEMP/openrv-language-dialog-work-$DIALOG_ARCH-$GITHUB_RUN_ID" \
            --output "$GITHUB_WORKSPACE/_release_work/macos-language-dialog-proof-$DIALOG_ARCH"
      - name: Preserve small native dialog evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-language-dialog-proof-${{ matrix.arch }}
          path: _release_work/macos-language-dialog-proof-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
